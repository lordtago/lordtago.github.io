name: Update views stats
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yt-dlp
      - run: python3 scripts/update_views.py
      - name: Commit if changed
        run: |
          git config user.name "views-bot"
          git config user.email "views-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "Update view counts"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
